name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: API (typecheck + tests on PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # A real PostgreSQL next to the job, so the exclusion constraint and the
    # concurrency test run against the same database engine as production.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: raha
          POSTGRES_PASSWORD: raha
          POSTGRES_DB: raha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raha"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://raha:raha@localhost:5432/raha_test
      DATABASE_URL: postgres://raha:raha@localhost:5432/raha_test
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  client:
    name: Web app (typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t raha .
